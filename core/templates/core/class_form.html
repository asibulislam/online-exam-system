{% extends "core/base.html" %}
{% block title %}New class · Online Exam System{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card p-4">
      <h3 class="page-title mb-3">New class</h3>
      <form method="post" novalidate>
        {% csrf_token %}
        {% include "core/_form_fields.html" %}
        <div class="d-flex gap-2">
          <button class="btn btn-brand" type="submit">Create class</button>
          <a class="btn btn-light border" href="{% url 'class_list' %}">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
