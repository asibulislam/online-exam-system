{% extends "core/base.html" %}
{% block title %}{{ title }} · Online Exam System{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="card p-4">
      <h3 class="page-title mb-3">{{ title }}</h3>
      <form method="post" novalidate>
        {% csrf_token %}
        {% include "core/_form_fields.html" %}
        <div class="d-flex gap-2">
          <button class="btn btn-brand" type="submit">Save exam</button>
          <a class="btn btn-light border" href="{% if exam %}{% url 'exam_detail' exam.pk %}{% else %}{% url 'dashboard' %}{% endif %}">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
