{% extends "core/base.html" %}
{% block title %}{{ title }} · Online Exam System{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <a href="{% url 'exam_detail' exam.pk %}" class="text-decoration-none small"><i class="bi bi-arrow-left"></i> {{ exam.title }}</a>
    <div class="card p-4 mt-2">
      <h3 class="page-title mb-3">{{ title }}</h3>
      <form method="post" novalidate>
        {% csrf_token %}
        {% include "core/_form_fields.html" %}
        <div class="d-flex flex-wrap gap-2">
          <button class="btn btn-brand" type="submit">Save</button>
          {% if title == "Add question" %}
            <button class="btn btn-outline-brand" type="submit" name="save_add" value="1">Save and add another</button>
          {% endif %}
          <a class="btn btn-light border" href="{% url 'exam_detail' exam.pk %}">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
