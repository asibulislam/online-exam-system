{% extends "core/base.html" %}
{% block title %}Sign up · Online Exam System{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7 col-lg-6">
    <div class="card p-4">
      <h3 class="page-title mb-1">Create your account</h3>
      <p class="text-muted">Already registered? <a href="{% url 'login' %}">Log in</a></p>
      <form method="post" novalidate>
        {% csrf_token %}
        {% include "core/_form_fields.html" %}
        <button class="btn btn-brand w-100" type="submit">Sign up</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
