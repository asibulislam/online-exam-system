{% extends "core/base.html" %}
{% block title %}Log in · Online Exam System{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card p-4">
      <h3 class="page-title mb-1">Welcome back</h3>
      <p class="text-muted">New here? <a href="{% url 'register' %}">Create an account</a></p>
      <form method="post" novalidate>
        {% csrf_token %}
        {% include "core/_form_fields.html" %}
        <input type="hidden" name="next" value="{{ next }}">
        <button class="btn btn-brand w-100" type="submit">Log in</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
